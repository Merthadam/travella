services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travella}
      POSTGRES_USER: ${POSTGRES_USER:-travella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travella-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  crud-migrate:
    build:
      context: .
      dockerfile: Dockerfile.auth
    working_dir: /app
    command: ["uv", "run", "--frozen", "--no-sync", "alembic", "-c", "/app/services/crud/alembic.ini", "upgrade", "head"]
    environment:
      CRUD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-travella}:${POSTGRES_PASSWORD:-travella-local-only}@postgres:5432/${POSTGRES_DB:-travella}
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    environment:
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      CRUD_BASE_URL: http://crud:8001
      AGENT_BASE_URL: http://agent:8002
      AGENTCORE_RUNTIME_ARN: ${AGENTCORE_RUNTIME_ARN:-}
      AGENTCORE_RUNTIME_REGION: ${AGENTCORE_RUNTIME_REGION:-${AWS_REGION:-eu-north-1}}
      SESSION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-travella}:${POSTGRES_PASSWORD:-travella-local-only}@postgres:5432/${POSTGRES_DB:-travella}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_JWKS_URL: ${COGNITO_JWKS_URL:-}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
    depends_on:
      crud:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  crud:
    build:
      context: .
      dockerfile: Dockerfile.auth
    command: ["uv", "run", "--frozen", "--no-sync", "uvicorn", "services.crud.server:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      CRUD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-travella}:${POSTGRES_PASSWORD:-travella-local-only}@postgres:5432/${POSTGRES_DB:-travella}
      CRUD_REQUIRED_SCOPE: ${CRUD_REQUIRED_SCOPE:-aws.cognito.signin.user.admin}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_JWKS_URL: ${COGNITO_JWKS_URL:-}
    depends_on:
      crud-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12

  research-mcp:
    build:
      context: .
      dockerfile: Dockerfile.auth
    command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "services.mcps.research_server"]
    env_file:
      - ./services/mcps/.env
      - ./services/mcps/.env.local-auth
    environment:
      PORT: "8000"
      MCP_ALLOWED_HOSTS: research-mcp:8000,localhost:8000,127.0.0.1:8000
      MCP_EVIDENCE_REGISTRY_PATH: /data/evidence.json
    volumes:
      - research-evidence:/data

  map-mcp:
    build:
      context: .
      dockerfile: Dockerfile.auth
    command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "services.mcps.map_server"]
    env_file:
      - ./services/mcps/.env
      - ./services/mcps/.env.local-auth
    environment:
      PORT: "8001"
      MCP_ALLOWED_HOSTS: map-mcp:8001,localhost:8001,127.0.0.1:8001

  agent:
    build:
      context: .
      dockerfile: Dockerfile.auth
    command: ["uv", "run", "--frozen", "--no-sync", "uvicorn", "services.agent.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8002", "--no-access-log"]
    env_file:
      - ./services/mcps/.env.local-auth
    environment:
      APP_ENV: ${APP_ENV:-development}
      CRUD_BASE_URL: http://crud:8001
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AGENTCORE_MEMORY_ID: ${AGENTCORE_MEMORY_ID:-}
      AGENTCORE_MEMORY_NAMESPACE_TEMPLATE: ${AGENTCORE_MEMORY_NAMESPACE_TEMPLATE:-traveler/__ACTOR_ID__/profile}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY_SECRET_ARN: ${ANTHROPIC_API_KEY_SECRET_ARN:-}
      AGENT_RESEARCH_MODEL: ${AGENT_RESEARCH_MODEL:-${ANTHROPIC_MODEL:-claude-sonnet-4-6}}
      AGENT_RESEARCH_MAX_TURNS: ${AGENT_RESEARCH_MAX_TURNS:-8}
      AGENT_RESEARCH_TIMEOUT_SECONDS: ${AGENT_RESEARCH_TIMEOUT_SECONDS:-120}
      AGENT_RESEARCH_MAX_BUDGET_USD: ${AGENT_RESEARCH_MAX_BUDGET_USD:-0.5}
      AGENT_RESEARCH_MAX_SEARCHES: ${AGENT_RESEARCH_MAX_SEARCHES:-3}
      AGENT_RESEARCH_MAX_FETCHES: ${AGENT_RESEARCH_MAX_FETCHES:-6}
      AGENT_MCP_TRANSPORT: local
      LOCAL_RESEARCH_MCP_URL: http://research-mcp:8000/mcp
      LOCAL_MAP_MCP_URL: http://map-mcp:8001/mcp
      AGENT_REQUIRED_SCOPE: ${AGENT_REQUIRED_SCOPE:-aws.cognito.signin.user.admin}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_JWKS_URL: ${COGNITO_JWKS_URL:-}
    depends_on:
      crud:
        condition: service_healthy
      research-mcp:
        condition: service_started
      map-mcp:
        condition: service_started
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_TARGET: http://auth:8000
    volumes:
      - ./frontend/.env.local:/app/.env.local:ro
    ports:
      - "5173:5173"
    depends_on:
      auth:
        condition: service_healthy

volumes:
  postgres-data:
  research-evidence:
