<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Travella Phase 3A UI prototype</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#17251f;background:#edf2ed;--ink:#17251f;--muted:#66756d;--line:#d8e1da;--paper:#fff;--accent:#0e765e;--soft:#dff1e9;--gold:#bd7a24}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf4ef,#e8eef5);color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:0}.prototype{min-height:100vh;padding:24px 24px 106px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1440px;margin:auto}.brand{font-size:12px;letter-spacing:.16em;font-weight:800}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);font-weight:800}.top-actions{display:flex;gap:10px;align-items:center}.ghost,.primary,.danger{border-radius:12px;padding:11px 15px;font-weight:750}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.primary{background:var(--accent);color:#fff}.danger{background:#fff0ed;color:#a33d32}.layout{max-width:1440px;margin:28px auto 0}.panel{background:rgba(255,255,255,.88);border:1px solid rgba(216,225,218,.95);border-radius:22px;box-shadow:0 18px 50px #31493b12}.heading h1{font-size:clamp(28px,4vw,48px);line-height:1;margin:8px 0 12px;letter-spacing:-.05em}.heading p{margin:0;color:var(--muted);max-width:650px}.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:#0b604d;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.map{position:relative;overflow:hidden;background:#d9e8e0;min-height:330px;border-radius:18px;background-image:linear-gradient(28deg,transparent 45%,#c0d6c9 46%,#c0d6c9 47%,transparent 48%),linear-gradient(-20deg,transparent 58%,#c5d9e5 59%,#c5d9e5 60%,transparent 61%),radial-gradient(circle at 28% 35%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 76% 60%,#fff9 0 2px,transparent 3px)}.map:after{content:'Google Maps / high-level place preview';position:absolute;bottom:14px;left:16px;color:#557064;font-size:11px;font-weight:700}.pin{position:absolute;width:18px;height:18px;border:4px solid #fff;border-radius:50% 50% 50% 0;background:#cc634d;transform:rotate(-45deg);box-shadow:0 3px 7px #263a3033}.pin:after{content:'';position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;top:3px;left:3px}.p1{left:26%;top:33%}.p2{left:58%;top:45%;background:#bd7a24}.p3{left:72%;top:25%;background:#3b7c9f}.destination-list{display:grid;gap:10px}.destination{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.destination h3{margin:0 0 3px;font-size:15px}.destination p{margin:0;color:var(--muted);font-size:12px}.destination button{white-space:nowrap}.brief h2,.destinations h2,.conversation h2{font-size:18px;margin:0 0 14px;letter-spacing:-.03em}.brief{padding:20px}.brief-list{display:grid;gap:9px}.brief-row{padding:10px 0;border-bottom:1px solid var(--line)}.brief-row:last-child{border-bottom:0}.brief-row label{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.brief-row input{width:100%;border:0;background:transparent;padding:6px 0 0;color:var(--ink);font-weight:750;outline:0}.brief-row input:focus{border-bottom:2px solid var(--accent)}.conversation{padding:20px;min-height:100%}.conversation .empty{border:1px dashed #b9c9be;border-radius:15px;padding:18px;background:#f7fbf8}.conversation p{color:var(--muted);font-size:13px;line-height:1.5}.conversation .placeholder{background:#f0f5f1;border-radius:13px;padding:12px;margin-top:12px;font-size:12px;color:#53665b}.variant-a .layout{display:grid;grid-template-columns:310px minmax(0,1fr) 300px;gap:18px}.variant-a .main{display:grid;gap:18px}.variant-a .map{min-height:410px}.variant-b .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.variant-b .main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:18px}.variant-b .map{min-height:550px}.variant-b .conversation{position:fixed;left:24px;bottom:92px;width:330px;z-index:5}.variant-b .conversation.closed{display:none}.variant-c .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.variant-c .main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.variant-c .map{min-height:270px;order:2}.variant-c .destinations{padding:24px}.variant-c .conversation{position:fixed;left:24px;top:92px;width:300px;z-index:5}.variant-c .conversation.closed{display:none}.prototype-switcher{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#12271f;color:#fff;border-radius:999px;padding:9px 12px;box-shadow:0 12px 30px #10231c55}.prototype-switcher button{width:32px;height:32px;border-radius:50%;background:#2d5548;color:#fff;font-size:20px}.prototype-switcher strong{min-width:210px;text-align:center;font-size:12px}.open-conversation{position:absolute;top:16px;right:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800}.variant-b .open-conversation,.variant-c .open-conversation{position:fixed;left:24px;bottom:92px;top:auto;z-index:6}.toast{position:fixed;right:24px;top:24px;background:#12271f;color:#fff;border-radius:12px;padding:12px 16px;font-size:12px;font-weight:750;display:none}.toast.show{display:block}@media(max-width:1050px){.variant-a .layout,.variant-b .layout,.variant-c .layout{grid-template-columns:1fr}.variant-a .conversation{order:3}.variant-a .brief{order:2}.variant-b .main,.variant-c .main{grid-template-columns:1fr}.variant-b .brief{order:2}.variant-c .map{order:0}}@media(max-width:620px){.prototype{padding:16px 14px 100px}.topbar{align-items:flex-start}.top-actions .ghost{display:none}.heading h1{font-size:34px}.variant-b .conversation,.variant-c .conversation{left:14px;right:14px;width:auto;bottom:88px}.variant-b .open-conversation,.variant-c .open-conversation{left:14px;bottom:88px}.prototype-switcher{bottom:12px}.prototype-switcher strong{min-width:145px}.map{min-height:270px!important}}
    .summary-dashboard{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:12px;margin:22px auto 0;max-width:1440px}.summary-card{padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:16px}.summary-card strong{display:block;font-size:22px;letter-spacing:-.04em;margin-top:5px}.summary-card p{margin:5px 0 0;color:var(--muted);font-size:12px}.summary-card.primary-card{background:#12392e;color:#fff;border-color:#12392e}.summary-card.primary-card p{color:#c6ded3}.view-panel{display:grid;gap:12px}.view-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}.view-toggle{display:flex;gap:4px;padding:4px;background:#e9f0eb;border-radius:11px}.view-toggle button{background:transparent;color:var(--muted);border-radius:8px;padding:8px 11px;font-size:12px;font-weight:800}.view-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px #1a362715}.variant-b .layout{margin-top:18px}.variant-b .main{display:block}.variant-b .brief{margin-top:18px}.variant-b .view-panel .map{min-height:520px}.variant-b .view-panel .destinations{padding:22px}.variant-b .conversation{bottom:104px}.variant-b .open-conversation{bottom:104px}.map-api-note{position:absolute;right:16px;bottom:14px;color:#557064;font-size:11px;font-weight:700;background:#ffffffb8;border-radius:8px;padding:5px 7px}.map:after{content:''}@media(max-width:1050px){.summary-dashboard{grid-template-columns:repeat(2,1fr)}.summary-card.primary-card{grid-column:span 2}}@media(max-width:620px){.summary-dashboard{grid-template-columns:1fr 1fr}.summary-card.primary-card{grid-column:span 2}.summary-card{padding:13px}.summary-card strong{font-size:18px}}
    .variant-b .conversation{left:auto!important;right:0!important;top:0!important;bottom:0!important;width:min(430px,92vw)!important;border-radius:22px 0 0 22px!important;transform:translateX(0);transition:transform .24s ease;z-index:12}.variant-b .conversation.closed{display:block;transform:translateX(105%);pointer-events:none}.variant-b .open-conversation{left:auto!important;right:24px!important;bottom:104px}.map-api-note{background:#ffffffb8;border-radius:8px;padding:5px 7px}.app-nav{max-width:1440px;margin:0 auto 18px;padding:10px 12px;display:flex;align-items:center;gap:18px;background:#12271f;color:#fff;border-radius:16px;box-shadow:0 12px 28px #10231c22}.app-nav .brand{white-space:nowrap}.app-nav .account-link{margin-left:auto;border-left:1px solid #416657;padding-left:16px;color:#d7e8df;text-decoration:none}.nav-trigger{background:#2d5548;color:#fff;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800}.plan-drawer{position:fixed;z-index:12;left:0;top:0;bottom:0;width:360px;padding:92px 24px 24px;background:#fff;border:0;border-right:1px solid var(--line);border-radius:0 22px 22px 0;box-shadow:18px 0 45px #152f2530;transform:translateX(0);transition:transform .24s ease}.plan-drawer.closed{display:block;transform:translateX(-105%);pointer-events:none}.plan-drawer h2{margin:5px 0 16px;font-size:20px;letter-spacing:-.04em}.plan-drawer a{display:block;text-decoration:none;color:var(--ink);padding:15px;border-radius:12px;margin:5px 0}.plan-drawer a.active{background:var(--soft);color:#0b604d;font-weight:800}.plan-drawer small{display:block;color:var(--muted);margin-top:3px}.drawer-backdrop{position:fixed;z-index:11;inset:0;background:#10231c45;opacity:1;transition:opacity .24s ease}.drawer-backdrop.closed{display:block;opacity:0;pointer-events:none}@media(max-width:620px){.app-nav{gap:8px}.app-nav .account-link{margin-left:auto}.plan-drawer{width:min(360px,92vw);padding-left:18px;padding-right:18px}.variant-b .conversation{width:92vw!important}}
  </style>
</head>
<body>
  <!-- PROTOTYPE QUESTION: Three variants of the Phase 3A Plan workspace, switchable via ?variant=A|B|C. Read-only fixture data; mutations are simulated. -->
  <main id="app" class="prototype"></main>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const variants={A:'Split workspace',B:'Map-first workspace',C:'List-first workspace'};
    let variant=new URLSearchParams(location.search).get('variant')||'A';
    let conversationOpen=variant==='A';
    let planNavOpen=false;
    let destinationView='map';
    const destinations=[['Lisbon','Portugal','City candidate'],['Copenhagen','Denmark','City candidate'],['Portugal','Portugal','Country candidate']];
    function map(){return '<div class="map" aria-label="High-level destination map"><span class="pin p1"></span><span class="pin p2"></span><span class="pin p3"></span><span class="map-api-note">Google Maps JavaScript API boundary</span></div>'}
    function list(){return '<section class="destinations panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="eyebrow">Candidate destinations</span><h2>Saved and suggested places</h2></div><span class="tag">3 candidates</span></div><div class="destination-list">'+destinations.map((d,i)=>'<div class="destination"><div><h3>'+d[0]+', '+d[1]+'</h3><p>'+d[2]+' · Google Places</p></div><button class="'+(i===0?'primary':'ghost')+'" data-save="'+d[0]+'">'+(i===0?'Saved':'Save pin')+'</button></div>').join('')+'</div></section>'}
    function summary(){return '<section class="summary-dashboard"><div class="summary-card primary-card"><span class="eyebrow" style="color:#c6ded3">Planning summary</span><strong>Find one place that fits.</strong><p>3 candidates · 1 saved pin · brief ready to refine</p></div><div class="summary-card"><span class="eyebrow">Destination</span><strong>Lisbon</strong><p>Saved city candidate</p></div><div class="summary-card"><span class="eyebrow">Brief</span><strong>5 fields</strong><p>Traveler-controlled</p></div><div class="summary-card"><span class="eyebrow">Conversation</span><strong>Ready</strong><p>Opens when agent phase starts</p></div></section>'}
    function destinationsSurface(){return '<section class="view-panel"><div class="view-toolbar"><div><span class="eyebrow">Explore candidates</span><h2 style="margin:5px 0 0">Map and list views</h2></div><div class="view-toggle" role="group" aria-label="Destination view"><button class="'+(destinationView==='map'?'active':'')+'" data-view="map">Map</button><button class="'+(destinationView==='list'?'active':'')+'" data-view="list">List</button></div></div>'+(destinationView==='map'?map():list())+'</section>'}
    function brief(){return '<section class="brief panel"><span class="eyebrow">Planning brief</span><h2>Traveler-controlled constraints</h2><div class="brief-list"><div class="brief-row"><label for="interest">Interests</label><input id="interest" value="Windsurfing, food, local history" /></div><div class="brief-row"><label for="dates">Dates</label><input id="dates" value="Flexible · July 2027" /></div><div class="brief-row"><label for="party">Party</label><input id="party" value="2 travelers" /></div><div class="brief-row"><label for="budget">Budget</label><input id="budget" value="Comfortable, moderate splurge" /></div><div class="brief-row"><label for="transport">Transport tolerance</label><input id="transport" value="Up to 90 minutes from airport" /></div></div><p style="font-size:12px;color:var(--muted);margin:14px 0 0">Edits save directly with a revision check.</p></section>'}
    function convo(){return '<aside class="conversation panel '+(conversationOpen?'':'closed')+'"><span class="eyebrow">Conversation</span><h2>Shape this Plan</h2><div class="empty"><strong>Agent conversation arrives later</strong><p>This panel is intentionally openable but non-functional in Phase 3A. The future agent will ask one focused question at a time.</p><div class="placeholder">A2UI event preview · question, choice, brief update</div></div></aside>'}
    function header(){return '<header class="topbar"><div><div class="brand">TRAVELLA / PHASE 3A PROTOTYPE</div><div class="eyebrow" style="margin-top:8px">Draft plan · Lisbon ideas</div></div><div class="top-actions"><button class="ghost" data-open>Open conversation</button><button class="primary">Confirm destination</button></div></header>'}
    header=()=>'<nav class="app-nav" aria-label="Application navigation"><div class="brand">TRAVELLA</div><button class="nav-trigger" data-plan-nav aria-expanded="'+planNavOpen+'">Plans</button><a class="account-link" href="#">Account</a></nav><header class="topbar"><div><div class="eyebrow">Draft plan · Lisbon ideas</div></div><div class="top-actions"><button class="ghost" data-open>Open conversation</button><button class="primary">Confirm destination</button></div></header>';
    planNav=()=>'<div class="drawer-backdrop '+(planNavOpen?'':'closed')+'" data-plan-nav-close></div><aside class="plan-drawer '+(planNavOpen?'':'closed')+'" aria-label="Plan navigation"><span class="eyebrow">Your plans</span><h2>Switch plan</h2><a class="active" href="#">Lisbon draft<small>3 candidates · updated now</small></a><a href="#">Copenhagen weekend<small>Brief in progress</small></a><a href="#">Portugal coast<small>Recently opened</small></a><button class="ghost" data-plan-nav-close style="margin-top:12px;width:100%">Close</button></aside>';
    map=()=>'<div class="map" aria-label="High-level destination map"><span class="pin p1"></span><span class="pin p2"></span><span class="pin p3"></span><span class="map-api-note">Map preview</span></div>';
    summary=()=>'<section class="summary-dashboard"><div class="summary-card primary-card"><span class="eyebrow" style="color:#c6ded3">Planning summary</span><strong>Lisbon draft</strong><p>3 candidates · 1 saved destination · brief in progress</p></div><div class="summary-card"><span class="eyebrow">Destination</span><strong>Lisbon</strong><p>Saved city candidate</p></div><div class="summary-card"><span class="eyebrow">Brief</span><strong>5 fields</strong><p>Ready to edit</p></div><div class="summary-card"><span class="eyebrow">Conversation</span><strong>Available</strong><p>Open from the right</p></div></section>';
    convo=()=>'<aside class="conversation panel '+(conversationOpen?'':'closed')+'"><span class="eyebrow">Conversation</span><h2>Plan conversation</h2><div class="empty"><strong>Conversation will open here</strong><p>This panel stays quiet in Phase 3A. The agent phase will use it for focused questions and confirmed updates.</p><div class="placeholder">Reserved for structured question and choice cards</div></div></aside>';
    function render(){
      const shell='<div class="heading"><span class="tag">Draft plan</span><h1>Review your destination options.</h1><p>Compare high-level places, keep the brief current, and confirm a starting point when you are ready.</p></div>';
      let body='';
      if(variant==='A') body='<div class="layout variant-a">'+convo()+'<div class="main">'+map()+list()+'</div>'+brief()+'</div>';
      if(variant==='B') body='<div class="layout variant-b"><div class="main">'+destinationsSurface()+'</div>'+brief()+convo()+'</div>';
      if(variant==='C') body='<div class="layout variant-c"><div class="main">'+list()+map()+'</div>'+brief()+convo()+'</div>';
      document.querySelector('#app').innerHTML=header()+planNav()+shell+summary()+body+'<nav class="prototype-switcher" aria-label="Prototype variants"><button data-prev aria-label="Previous variant">‹</button><strong>'+variant+' · '+variants[variant]+'</strong><button data-next aria-label="Next variant">›</button></nav>';
      document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{conversationOpen=true;render()});
      document.querySelectorAll('[data-plan-nav]').forEach(b=>b.onclick=()=>{planNavOpen=!planNavOpen;render()});
      document.querySelectorAll('[data-plan-nav-close]').forEach(b=>b.onclick=()=>{planNavOpen=false;render()});
      document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{b.textContent='Saved';b.className='primary';toast('Saved '+b.dataset.save+' as a high-level pin')});
      document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{destinationView=b.dataset.view;render()});
      document.querySelectorAll('input').forEach(i=>i.onchange=()=>toast('Brief edit staged: '+i.value));
      document.querySelector('[data-prev]').onclick=()=>cycle(-1);document.querySelector('[data-next]').onclick=()=>cycle(1);
    }
    function cycle(delta){const keys=Object.keys(variants),i=keys.indexOf(variant);variant=keys[(i+delta+keys.length)%keys.length];history.replaceState({},'', '?variant='+variant);conversationOpen=variant==='A';render()}
    function toast(message){const t=document.querySelector('#toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
    render();
  </script>
</body>
</html>
