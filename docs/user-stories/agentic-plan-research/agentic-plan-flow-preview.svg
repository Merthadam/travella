<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title description">
  <title id="title">US-002 agentic plan flow</title>
  <desc id="description">A spacious flowchart for researching and shaping a Travella plan through conversation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #1f2937; }
      .node { stroke-width: 2; rx: 10; ry: 10; }
      .traveler { fill: #dae8fc; stroke: #6c8ebf; }
      .agent { fill: #d5e8d4; stroke: #82b366; }
      .brief { fill: #e1d5e7; stroke: #9673a6; }
      .control { fill: #fff2cc; stroke: #d6b656; }
      .plan { fill: #f8cecc; stroke: #b85450; }
      .info { fill: #f5f5f5; stroke: #666666; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
      .main { font: 600 16px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .sub { font: 12px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .label { font: 11px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .legend { font: 13px Arial, sans-serif; fill: #1f2937; }
    </style>
  </defs>
  <g transform="scale(0.7)">
  <rect width="1600" height="1400" fill="#ffffff"/>
  <text x="60" y="62" class="title">US-002 · Research and shape a Plan through Conversation</text>

  <circle cx="140" cy="167" r="12" fill="#1f2937"/>
  <rect x="60" y="225" width="160" height="72" class="node info"/>
  <text x="140" y="254" class="main">Draft Plan</text><text x="140" y="276" class="sub">destination may be undecided</text>
  <rect x="270" y="225" width="205" height="72" class="node traveler"/>
  <text x="373" y="254" class="main">Traveler starts with an intent</text><text x="373" y="276" class="main">or known destination</text>
  <rect x="540" y="215" width="240" height="86" class="node agent"/>
  <text x="660" y="249" class="main">Progressive Conversation</text><text x="660" y="273" class="sub">light grilling; traveler may fast-forward</text>
  <rect x="840" y="215" width="220" height="86" class="node brief"/>
  <text x="950" y="249" class="main">Update editable planning brief</text><text x="950" y="273" class="sub">active preferences and constraints</text>
  <rect x="1110" y="225" width="205" height="72" class="node agent"/>
  <text x="1213" y="266" class="main">Research and recommendations</text>
  <rect x="1110" y="410" width="205" height="72" class="node info"/>
  <text x="1213" y="440" class="main">Source indicators and</text><text x="1213" y="462" class="main">surfaced uncertainty</text>
  <polygon points="1470,195 1550,251 1470,307 1390,251" class="control" stroke-width="2"/>
  <text x="1470" y="248" class="main">Destination</text><text x="1470" y="270" class="main">chosen?</text>

  <rect x="1370" y="420" width="200" height="72" class="node traveler"/>
  <text x="1470" y="449" class="main">Traveler explicitly confirms</text><text x="1470" y="471" class="main">one destination/city</text>
  <rect x="1370" y="580" width="200" height="72" class="node agent"/>
  <text x="1470" y="609" class="main">Destination-specific research</text><text x="1470" y="631" class="main">and recommendations</text>
  <rect x="1370" y="740" width="200" height="72" class="node control"/>
  <text x="1470" y="769" class="main">Traveler explicitly confirms</text><text x="1470" y="791" class="main">a Plan change</text>
  <rect x="1370" y="900" width="200" height="72" class="node plan"/>
  <text x="1470" y="929" class="main">Selected Option / Map Pin</text><text x="1470" y="951" class="main">added, changed, or removed</text>

  <rect x="80" y="520" width="220" height="72" class="node traveler"/>
  <text x="190" y="549" class="main">Traveler redirects</text><text x="190" y="571" class="main">or interrupts research</text>
  <rect x="620" y="1080" width="240" height="72" class="node traveler"/>
  <text x="740" y="1109" class="main">Traveler requests</text><text x="740" y="1131" class="main">a new destination</text>
  <rect x="980" y="1080" width="260" height="72" class="node plan"/>
  <text x="1110" y="1109" class="main">Identify affected destination-specific</text><text x="1110" y="1131" class="main">selections and pins</text>
  <rect x="980" y="1220" width="260" height="72" class="node control"/>
  <text x="1110" y="1249" class="main">Traveler confirms clearing</text><text x="1110" y="1271" class="main">affected choices and pins</text>

  <path d="M140 179 V225" class="edge"/>
  <path d="M220 261 H270" class="edge"/><text x="245" y="250" class="label">open or resume</text>
  <path d="M475 261 H540" class="edge"/><text x="508" y="250" class="label">describe idea</text>
  <path d="M780 258 H840" class="edge"/><text x="810" y="248" class="label">clarify only what matters</text>
  <path d="M1060 258 H1110" class="edge"/><text x="1085" y="248" class="label">brief informs research</text>
  <path d="M1213 297 V410" class="edge"/><text x="1295" y="360" class="label">inspect when wanted</text>
  <path d="M1315 261 H1390" class="edge"/><text x="1352" y="250" class="label">continue discovery</text>
  <path d="M1470 307 V560 H660 V301" class="edge dash"/><text x="1065" y="549" class="label">not yet</text>
  <path d="M1470 307 V420" class="edge"/><text x="1492" y="370" class="label">yes</text>
  <path d="M1470 492 V580" class="edge"/><text x="1518" y="540" class="label">destination set</text>
  <path d="M1470 652 V740" class="edge"/><text x="1528" y="700" class="label">recommendation only</text>
  <path d="M1470 812 V900" class="edge"/><text x="1512" y="860" class="label">confirmed</text>
  <path d="M300 556 H430 V258 H540" class="edge"/><text x="430" y="545" class="label">new instruction</text>
  <path d="M1470 972 V1030 H740 V1080" class="edge"/><text x="1105" y="1020" class="label">change destination</text>
  <path d="M860 1116 H980" class="edge"/><text x="920" y="1105" class="label">review affected choices</text>
  <path d="M1110 1152 V1220" class="edge"/><text x="1218" y="1190" class="label">clear only when confirmed</text>
  <path d="M980 1256 H470 V330 H660 V301" class="edge"/><text x="720" y="1245" class="label">broader context stays active</text>

  <rect x="60" y="1330" width="1510" height="54" fill="#f5f5f5" stroke="#666666" rx="7"/>
  <text x="80" y="1353" class="legend" font-weight="700">Legend</text>
  <text x="80" y="1374" class="legend">Blue: traveler action · Green: agent activity · Purple: planning brief · Yellow: explicit confirmation/decision · Red: persisted Plan change · Grey: information/state</text>
  </g>
</svg>
