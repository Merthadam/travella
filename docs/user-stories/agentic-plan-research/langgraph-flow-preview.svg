<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">US-002 LangGraph flow</title>
  <desc id="description">Technical LangGraph flow for Travella research and destination discovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      .title { font: 700 20px Arial, sans-serif; fill: #1f2937; }
      .node { stroke-width: 2; rx: 8; ry: 8; }
      .blue { fill: #dae8fc; stroke: #6c8ebf; }
      .green { fill: #d5e8d4; stroke: #82b366; }
      .purple { fill: #e1d5e7; stroke: #9673a6; }
      .yellow { fill: #fff2cc; stroke: #d6b656; }
      .red { fill: #f8cecc; stroke: #b85450; }
      .grey { fill: #f5f5f5; stroke: #666666; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
      .main { font: 600 13px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .sub { font: 10px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .label { font: 10px Arial, sans-serif; fill: #334155; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="40" y="38" class="title">US-002 · LangGraph flow for research and destination discovery</text>

  <rect x="485" y="70" width="220" height="52" class="node blue"/>
  <text x="595" y="101" class="main">Incoming browser event</text>
  <polygon points="595,145 670,190 595,235 520,190" class="yellow" stroke-width="2"/>
  <text x="595" y="187" class="main">Top-level</text><text x="595" y="205" class="main">event router</text>

  <rect x="45" y="270" width="180" height="54" class="node blue"/>
  <text x="135" y="302" class="main">Direct canvas brief edit</text>
  <rect x="45" y="365" width="180" height="54" class="node grey"/>
  <text x="135" y="397" class="main">Validate typed patch</text>
  <rect x="45" y="465" width="180" height="62" class="node purple"/>
  <text x="135" y="492" class="main">Apply graph context</text><text x="135" y="512" class="main">and AG-UI projection</text>

  <rect x="330" y="270" width="190" height="54" class="node blue"/>
  <text x="425" y="302" class="main">Confirmed UI action</text>
  <rect x="330" y="440" width="190" height="62" class="node yellow"/>
  <text x="425" y="467" class="main">Confirmation gate</text><text x="425" y="487" class="sub">validate single-use token</text>
  <rect x="330" y="545" width="190" height="52" class="node red"/>
  <text x="425" y="576" class="main">CRUD mutation</text>
  <rect x="330" y="640" width="190" height="62" class="node purple"/>
  <text x="425" y="667" class="main">Durable milestone checkpoint</text><text x="425" y="687" class="sub">and CRUD sync</text>

  <rect x="805" y="270" width="190" height="54" class="node blue"/>
  <text x="900" y="302" class="main">Chat message</text>
  <rect x="770" y="365" width="260" height="64" class="node purple"/>
  <text x="900" y="392" class="main">Hydrate Plan and relevant</text><text x="900" y="412" class="main">long-term memory context</text>
  <polygon points="900,465 975,510 900,555 825,510" class="yellow" stroke-width="2"/>
  <text x="900" y="507" class="main">Minimal workflow</text><text x="900" y="525" class="main">router</text>
  <rect x="1035" y="480" width="145" height="62" class="node green"/>
  <text x="1108" y="507" class="main">Known destination</text><text x="1108" y="527" class="sub">Choose destination</text>

  <rect x="630" y="600" width="550" height="180" fill="#ffffff" stroke="#82b366" stroke-width="2" rx="10"/>
  <rect x="630" y="600" width="550" height="30" fill="#d5e8d4" stroke="#82b366" stroke-width="2" rx="10"/>
  <text x="650" y="620" class="main" text-anchor="start">Destination discovery flow</text>
  <rect x="650" y="655" width="110" height="52" class="node purple"/>
  <text x="705" y="686" class="main">Build brief</text>
  <polygon points="805,645 865,680 805,715 745,680" class="yellow" stroke-width="2"/>
  <text x="805" y="677" class="main">Enough?</text>
  <rect x="895" y="645" width="120" height="56" class="node grey"/>
  <text x="955" y="671" class="main">Focused question</text><text x="955" y="691" class="sub">internal pause</text>
  <rect x="895" y="720" width="150" height="44" class="node green"/>
  <text x="970" y="747" class="main">Research + normalize</text>
  <polygon points="1090,712 1150,742 1090,772 1030,742" class="yellow" stroke-width="2"/>
  <text x="1090" y="746" class="main">Evidence?</text>

  <rect x="650" y="815" width="200" height="56" class="node green"/>
  <text x="750" y="841" class="main">Contrasting shortlist</text><text x="750" y="861" class="sub">validated UI projection</text>
  <rect x="940" y="815" width="210" height="56" class="node green"/>
  <text x="1045" y="841" class="main">Candidate deep dive</text><text x="1045" y="861" class="sub">targeted research and assessment</text>

  <path d="M595 122 V145" class="edge"/>
  <path d="M520 190 H300 V297 H225" class="edge"/><text x="335" y="180" class="label">canvas edit</text>
  <path d="M560 225 H425 V270" class="edge"/><text x="470" y="250" class="label">confirmed action</text>
  <path d="M670 190 H900 V270" class="edge"/><text x="785" y="180" class="label">chat</text>
  <path d="M135 324 V365" class="edge"/><path d="M135 419 V465" class="edge"/>
  <path d="M425 324 V440" class="edge"/><path d="M425 502 V545" class="edge"/><path d="M425 597 V640" class="edge"/>
  <path d="M900 324 V365" class="edge"/><path d="M900 429 V465" class="edge"/>
  <path d="M975 510 H1035" class="edge"/><text x="1005" y="500" class="label">known destination</text>
  <path d="M900 555 V600" class="edge"/><text x="965" y="580" class="label">discovery</text>
  <path d="M760 681 H745" class="edge"/><path d="M865 680 H895" class="edge"/><text x="880" y="670" class="label">no</text>
  <path d="M805 715 V742 H895" class="edge"/><text x="850" y="733" class="label">yes</text>
  <path d="M1045 742 H1030" class="edge"/><path d="M1150 742 V815 H850" class="edge"/><text x="1100" y="795" class="label">enough evidence</text>
  <path d="M895 673 H865 V635 H705 V655" class="edge dash"/><text x="790" y="645" class="label">next answer</text>
  <path d="M850 843 H940" class="edge"/><text x="895" y="833" class="label">focus candidate</text>
  <path d="M940 863 H870 V880 H750 V871" class="edge"/><text x="850" y="895" class="label">return to compare</text>
  <path d="M750 815 V730 H610 V471 H520" class="edge"/><text x="615" y="720" class="label">Choose this destination</text>
  <path d="M1108 542 V720 H610 V471 H520" class="edge"/><text x="1100" y="590" class="label">choose</text>

  <rect x="45" y="760" width="505" height="105" fill="#f5f5f5" stroke="#666666" rx="8"/>
  <text x="62" y="785" class="main" text-anchor="start">Pause / save policy</text>
  <text x="62" y="807" class="sub" text-anchor="start">Questions and shortlists use internal LangGraph recovery checkpoints.</text>
  <text x="62" y="827" class="sub" text-anchor="start">Only milestones, confirmed changes, and idle saves synchronize to CRUD.</text>
</svg>
