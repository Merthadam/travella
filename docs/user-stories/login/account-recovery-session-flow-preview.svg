<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-labelledby="title desc"><title id="title">US-001 Account recovery and session management flow</title><desc id="desc">Spacious three-lane user flow for account access, recovery, and session management.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>.t{font:700 24px Arial;fill:#1f2937}.h{font:700 18px Arial;fill:#334155}.m{font:600 16px Arial;fill:#1f2937;text-anchor:middle}.s{font:13px Arial;fill:#334155;text-anchor:middle}.e{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}.l{font:12px Arial;fill:#334155}.n{stroke-width:2;rx:12;ry:12}.b{fill:#dae8fc;stroke:#6c8ebf}.g{fill:#d5e8d4;stroke:#82b366}.p{fill:#e1d5e7;stroke:#9673a6}.y{fill:#fff2cc;stroke:#d6b656}.r{fill:#f8cecc;stroke:#b85450}.i{fill:#f5f5f5;stroke:#666}</style></defs><rect width="2200" height="1320" fill="#fff"/><text x="70" y="62" class="t">US-001 · Account recovery and session management</text>
<text x="70" y="145" class="h">A · Account access</text><rect x="70" y="210" width="185" height="78" class="n i"/><text x="163" y="255" class="m">Anonymous traveler</text><rect x="350" y="210" width="200" height="78" class="n b"/><text x="450" y="255" class="m">Register or sign in</text><polygon points="748,195 825,249 748,303 670,249" class="y" stroke-width="2"/><text x="748" y="244" class="m">Email</text><text x="748" y="264" class="m">verified?</text><rect x="650" y="75" width="195" height="62" class="n y"/><text x="748" y="112" class="m">Send verification email</text><polygon points="1030,185 1120,249 1030,313 940,249" class="y" stroke-width="2"/><text x="1030" y="244" class="s">Two-step verification</text><text x="1030" y="263" class="s">configured?</text><rect x="1240" y="210" width="215" height="78" class="n g"/><text x="1348" y="255" class="m">Authenticator-app challenge</text><rect x="1560" y="210" width="220" height="78" class="n p"/><text x="1670" y="246" class="m">Session active</text><text x="1670" y="267" class="s">short-lived token + silent refresh</text><rect x="1885" y="210" width="210" height="78" class="n g"/><text x="1990" y="246" class="m">Authorized page</text><text x="1990" y="267" class="s">or My plans</text><path d="M255 249H350M550 249H670M825 249H940M1120 249H1240M1455 249H1560M1780 249H1885" class="e"/><path d="M748 195V137" class="e"/><text x="765" y="178" class="l">no</text><path d="M650 106H450V210" class="e"/><text x="500" y="95" class="l">verify</text><text x="850" y="238" class="l">yes</text><text x="1140" y="238" class="l">yes</text><path d="M1030 313V340H1670V288" class="e"/><text x="1048" y="332" class="l">no</text>
<text x="70" y="440" class="h">B · Password and MFA recovery</text><rect x="70" y="500" width="185" height="78" class="n b"/><text x="163" y="546" class="m">Forgot password</text><rect x="350" y="500" width="230" height="78" class="n i"/><text x="465" y="537" class="m">Neutral confirmation</text><text x="465" y="558" class="s">no account-status disclosure</text><polygon points="785,485 870,539 785,593 700,539" class="y" stroke-width="2"/><text x="785" y="535" class="m">Verified</text><text x="785" y="555" class="m">account?</text><rect x="990" y="500" width="220" height="78" class="n g"/><text x="1100" y="537" class="m">Password-reset email</text><text x="1100" y="558" class="s">time-limited · single-use</text><rect x="1320" y="500" width="190" height="78" class="n b"/><text x="1415" y="546" class="m">Set new password</text><rect x="1620" y="500" width="220" height="78" class="n r"/><text x="1730" y="546" class="m">End all account sessions</text><rect x="1945" y="500" width="190" height="78" class="n b"/><text x="2040" y="537" class="m">Return to sign in</text><text x="2040" y="558" class="s">new password and MFA</text><path d="M255 539H350M580 539H700M870 539H990M1210 539H1320M1510 539H1620M1840 539H1945" class="e"/><text x="885" y="527" class="l">yes</text><rect x="975" y="650" width="250" height="66" class="n y"/><text x="1100" y="679" class="m">Unverified: send verification email</text><text x="1100" y="700" class="s">then sign in</text><path d="M785 593V683H975" class="e"/><text x="802" y="620" class="l">no</text><rect x="1240" y="650" width="190" height="66" class="n i"/><text x="1335" y="690" class="m">App unavailable</text><rect x="1540" y="650" width="205" height="66" class="n b"/><text x="1643" y="690" class="m">Use one recovery code</text><rect x="1855" y="650" width="240" height="66" class="n r"/><text x="1975" y="679" class="m">Set replacement authenticator</text><text x="1975" y="700" class="s">before My plans</text><path d="M1348 288V683H1240M1430 683H1540M1745 683H1855" class="e"/><text x="1365" y="630" class="l">lost app</text>
<text x="70" y="855" class="h">C · Session end and safe return</text><rect x="70" y="920" width="175" height="74" class="n p"/><text x="158" y="964" class="m">Session active</text><rect x="350" y="920" width="195" height="74" class="n i"/><text x="448" y="964" class="m">Access token expires</text><polygon points="760,902 855,957 760,1012 665,957" class="y" stroke-width="2"/><text x="760" y="950" class="s">Silent refresh valid</text><text x="760" y="969" class="s">and within 30 days?</text><rect x="975" y="920" width="245" height="74" class="n r"/><text x="1098" y="954" class="m">Clear session and private view</text><text x="1098" y="975" class="s">keep safe internal destination</text><rect x="1330" y="920" width="175" height="74" class="n b"/><text x="1418" y="964" class="m">Full sign in</text><polygon points="1720,902 1815,957 1720,1012 1625,957" class="y" stroke-width="2"/><text x="1720" y="950" class="s">Authorized internal</text><text x="1720" y="969" class="s">page?</text><rect x="1935" y="880" width="200" height="66" class="n g"/><text x="2035" y="920" class="m">Resume requested page</text><rect x="1935" y="1035" width="200" height="66" class="n r"/><text x="2035" y="1075" class="m">My plans fallback</text><path d="M245 957H350M545 957H665M855 957H975M1220 957H1330M1505 957H1625M1815 935H1935M1815 979V1068H1935" class="e"/><text x="875" y="946" class="l">no</text><path d="M760 902V870H158V920" class="e"/><text x="778" y="887" class="l">yes</text><text x="1835" y="925" class="l">yes</text><text x="1835" y="1020" class="l">no</text><rect x="350" y="1070" width="235" height="66" class="n b"/><text x="468" y="1098" class="m">Sign out current browser</text><text x="468" y="1119" class="s">next sign-in starts at My plans</text><path d="M158 994V1103H350" class="e"/><text x="177" y="1040" class="l">sign out</text><rect x="70" y="1200" width="2065" height="62" class="n i"/><text x="90" y="1228" class="m" text-anchor="start">Legend</text><text x="90" y="1251" class="s" text-anchor="start">Blue: traveler action · Green: successful authenticated step · Purple: active session · Yellow: decision · Red: security boundary or required re-authentication · Grey: information</text></svg>
