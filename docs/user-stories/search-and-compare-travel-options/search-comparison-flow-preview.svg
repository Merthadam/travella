<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="475" viewBox="0 0 1500 475" role="img" aria-labelledby="title description">
  <title id="title">Travella US-005 search and comparison flow</title>
  <desc id="description">A user flow from initiating a travel search through criteria collection, optional provisional-date research, provider results, comparison, refresh, provider recheck, and the explicit add-to-Plan confirmation.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 z" fill="#475569"/></marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .node { stroke-width: 2; rx: 12; ry: 12; }
      .label { font: 600 17px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .small { font: 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 13px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .action { fill: #dae8fc; stroke: #6c8ebf; }
      .provider { fill: #d5e8d4; stroke: #82b366; }
      .decision { fill: #fff2cc; stroke: #d6b656; }
      .inspect { fill: #e1d5e7; stroke: #9673a6; }
      .risk { fill: #f8cecc; stroke: #b85450; }
      .context { fill: #f5f5f5; stroke: #666666; }
    </style>
  </defs>
  <g transform="scale(0.5)">

  <rect width="3000" height="950" fill="#ffffff"/>
  <text x="60" y="62" class="title">US-005 · Search and compare travel options</text>

  <!-- Edges behind nodes -->
  <path class="edge" d="M245 308 H295"/><text x="270" y="294" class="edge-label">open</text>
  <path class="edge" d="M505 308 H555"/><text x="530" y="294" class="edge-label">request</text>
  <path class="edge" d="M785 308 H845"/><text x="815" y="294" class="edge-label">ready</text>
  <path class="edge" d="M912 263 V186 H930"/><text x="895" y="220" class="edge-label">no</text>
  <path class="edge" d="M980 308 H1050"/><text x="1015" y="294" class="edge-label">yes</text>
  <path class="edge" d="M1030 148 H1040 V308 H1050"/><text x="1054" y="226" class="edge-label">explore</text>
  <path class="edge" d="M1245 308 H1305"/><text x="1275" y="294" class="edge-label">search</text>
  <path class="edge" d="M1372 353 V445"/><text x="1350" y="404" class="edge-label">no</text>
  <path class="edge" d="M1270 483 H1240 V390 H1148 V346"/><text x="1222" y="414" class="edge-label">Retry</text>
  <path class="edge" d="M1440 308 H1500"/><text x="1470" y="294" class="edge-label">yes</text>
  <path class="edge" d="M1625 346 V605"/><text x="1650" y="475" class="edge-label">inspect</text>
  <path class="edge" d="M1660 346 V390 H1888 V605"/><text x="1888" y="475" class="edge-label">more</text>
  <path class="edge" d="M1625 346 V555 H1145 V605"/><text x="1330" y="545" class="edge-label">revise</text>
  <path class="edge" d="M1240 643 H1275"/><text x="1258" y="629" class="edge-label">Refresh</text>
  <path class="edge" d="M1370 681 V740 H1000 V308 H1050"/><text x="1110" y="725" class="edge-label">new query</text>
  <path class="edge" d="M1750 308 H1810"/><text x="1780" y="294" class="edge-label">add</text>
  <path class="edge" d="M1975 308 H2025"/><text x="2000" y="294" class="edge-label">chosen</text>
  <path class="edge" d="M2100 263 V186"/><text x="2082" y="220" class="edge-label">no</text>
  <path class="edge" d="M2098 110 V85 H670 V270"/><text x="1360" y="75" class="edge-label">set dates</text>
  <path class="edge" d="M2175 308 H2225"/><text x="2200" y="294" class="edge-label">yes</text>
  <path class="edge" d="M2430 308 H2480"/><text x="2455" y="294" class="edge-label">recheck</text>
  <path class="edge" d="M2560 360 V445"/><text x="2542" y="404" class="edge-label">no</text>
  <path class="edge" d="M2560 521 V560 H1625 V346"/><text x="2110" y="550" class="edge-label">return to results</text>
  <path class="edge" d="M2640 308 H2700"/><text x="2670" y="294" class="edge-label">yes</text>

  <!-- Main flow -->
  <rect x="60" y="270" width="185" height="76" class="node context"/>
  <text x="152" y="300" class="label">Chosen destination</text><text x="152" y="324" class="small">Draft Plan and Conversation</text>
  <rect x="295" y="270" width="210" height="76" class="node action"/>
  <text x="400" y="300" class="label">Request stay, flight,</text><text x="400" y="322" class="label">or car rental</text>
  <rect x="555" y="270" width="230" height="76" class="node action"/>
  <text x="670" y="300" class="label">Validated criteria controls</text><text x="670" y="324" class="small">brief context + missing inputs</text>
  <polygon points="912,263 980,308 912,353 845,308" class="decision" stroke-width="2"/>
  <text x="912" y="313" class="label">Exact dates?</text>
  <rect x="830" y="110" width="200" height="76" class="node decision"/>
  <text x="930" y="140" class="label">Propose provisional dates</text><text x="930" y="164" class="small">exploration only</text>
  <rect x="1050" y="270" width="195" height="76" class="node provider"/>
  <text x="1147" y="313" class="label">Search functional provider</text>
  <polygon points="1372,263 1440,308 1372,353 1305,308" class="decision" stroke-width="2"/>
  <text x="1372" y="313" class="label">Provider responds?</text>
  <rect x="1270" y="445" width="200" height="76" class="node risk"/>
  <text x="1370" y="476" class="label">Keep prior results</text><text x="1370" y="500" class="small">show issue and Retry</text>
  <rect x="1500" y="270" width="250" height="76" class="node provider"/>
  <text x="1625" y="300" class="label">Curated provider cards</text><text x="1625" y="324" class="small">3–5 · best fit · total or estimated total</text>

  <!-- Results interactions -->
  <rect x="1050" y="605" width="190" height="76" class="node action"/>
  <text x="1145" y="648" class="label">Edit criteria or filters</text>
  <rect x="1275" y="605" width="190" height="76" class="node decision"/>
  <text x="1370" y="636" class="label">Refresh results</text><text x="1370" y="660" class="small">prior cards stay Updating</text>
  <rect x="1510" y="605" width="220" height="76" class="node inspect"/>
  <text x="1620" y="636" class="label">Open detail panel</text><text x="1620" y="660" class="small">or compare up to 3</text>
  <rect x="1785" y="605" width="205" height="76" class="node inspect"/>
  <text x="1887" y="648" class="label">Show more provider results</text>

  <!-- Protected selection -->
  <rect x="1810" y="270" width="165" height="76" class="node action"/>
  <text x="1892" y="313" class="label">Add this option</text>
  <polygon points="2100,263 2175,308 2100,353 2025,308" class="decision" stroke-width="2"/>
  <text x="2100" y="302" class="label">Exact dates</text><text x="2100" y="321" class="label">confirmed?</text>
  <rect x="2000" y="110" width="195" height="76" class="node decision"/>
  <text x="2097" y="153" class="label">Ask for exact dates</text>
  <rect x="2225" y="270" width="205" height="76" class="node provider"/>
  <text x="2327" y="300" class="label">Recheck provider</text><text x="2327" y="324" class="small">availability + material terms</text>
  <polygon points="2560,255 2640,308 2560,360 2480,308" class="decision" stroke-width="2"/>
  <text x="2560" y="299" class="label">Still available with</text><text x="2560" y="318" class="label">unchanged terms?</text>
  <rect x="2460" y="445" width="200" height="76" class="node risk"/>
  <text x="2560" y="476" class="label">Explain change or</text><text x="2560" y="498" class="label">unavailability</text>
  <rect x="2700" y="270" width="210" height="76" class="node risk"/>
  <text x="2805" y="300" class="label">US-003 explicit</text><text x="2805" y="322" class="label">add-to-Plan confirmation</text>

  <rect x="60" y="820" width="2850" height="62" rx="10" ry="10" fill="#f5f5f5" stroke="#666666"/>
  <text x="82" y="846" text-anchor="start" style="font:700 14px Arial,sans-serif;fill:#1f2937">Legend</text>
  <text x="82" y="870" text-anchor="start" style="font:13px Arial,sans-serif;fill:#334155">Blue: traveler action · Green: provider search/result · Purple: inspect or compare · Yellow: decision, assumption, or explicit refresh · Red: failure or protected handoff</text>
  </g>
</svg>
