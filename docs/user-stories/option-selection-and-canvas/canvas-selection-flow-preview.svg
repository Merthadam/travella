<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description">
  <title id="title">US-003 Planning Canvas flow</title>
  <desc id="description">A clean three-lane flowchart for searching, saving, and managing options on the Travella Planning Canvas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <style>.title { font: 700 22px Arial, sans-serif; fill: #1f2937; }.lane { font: 700 15px Arial, sans-serif; fill: #334155; }.node { stroke-width: 2; rx: 10; ry: 10; }.traveler { fill: #dae8fc; stroke: #6c8ebf; }.provider { fill: #d5e8d4; stroke: #82b366; }.canvas { fill: #e1d5e7; stroke: #9673a6; }.control { fill: #fff2cc; stroke: #d6b656; }.plan { fill: #f8cecc; stroke: #b85450; }.info { fill: #f5f5f5; stroke: #666666; }.edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }.main { font: 600 16px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }.sub { font: 12px Arial, sans-serif; fill: #334155; text-anchor: middle; }.label { font: 11px Arial, sans-serif; fill: #334155; text-anchor: middle; }.note { font: 12px Arial, sans-serif; fill: #334155; }.legend { font: 13px Arial, sans-serif; fill: #1f2937; }</style>
  </defs>
  <rect width="1600" height="940" fill="#ffffff"/><text x="60" y="62" class="title">US-003 · Planning Canvas: search, save, and manage</text>
  <rect x="60" y="390" width="200" height="78" class="node info"/><text x="160" y="421" class="main">Confirmed destination</text><text x="160" y="445" class="sub">Draft Plan and linked Conversation</text>
  <rect x="300" y="390" width="220" height="78" class="node canvas"/><text x="410" y="421" class="main">Planning Canvas</text><text x="410" y="445" class="sub">map first · switch to categorized list</text>
  <text x="580" y="132" class="lane">A · Provider-backed options</text><text x="580" y="150" class="sub" text-anchor="start">stays · flights · car rentals</text>
  <rect x="580" y="155" width="185" height="72" class="node traveler"/><text x="673" y="186" class="main">Search from</text><text x="673" y="209" class="main">Canvas box</text><rect x="820" y="155" width="210" height="72" class="node provider"/><text x="925" y="186" class="main">Inspect provider result</text><text x="925" y="209" class="sub">only functional modes appear</text><rect x="1085" y="155" width="200" height="72" class="node control"/><text x="1185" y="186" class="main">Explicit confirmation</text><text x="1185" y="209" class="sub">addition or replacement</text><rect x="1340" y="155" width="200" height="72" class="node plan"/><text x="1440" y="186" class="main">Save Selected Option</text><text x="1440" y="209" class="main">and applicable Map Pin</text>
  <path d="M1085 250 H1540 V314 H1085 Z" fill="#f5f5f5" stroke="#666666"/><text x="1100" y="274" class="note">If a stay, flight, or car rental is already selected, the confirmation names the option and Map Pin being replaced.</text>
  <text x="580" y="387" class="lane">B · Map-place search</text><text x="580" y="405" class="sub" text-anchor="start">stays · restaurants · activities</text>
  <rect x="580" y="410" width="185" height="72" class="node traveler"/><text x="673" y="441" class="main">Search or browse</text><text x="673" y="464" class="main">the map</text><rect x="820" y="410" width="210" height="72" class="node info"/><text x="925" y="441" class="main">Inspect temporary</text><text x="925" y="464" class="main">search-result pin</text><rect x="1085" y="410" width="200" height="72" class="node traveler"/><text x="1185" y="441" class="main">Choose category</text><text x="1185" y="464" class="sub">stay · restaurant · activity</text><rect x="1340" y="410" width="200" height="72" class="node control"/><text x="1440" y="441" class="main">Explicit confirmation</text><text x="1440" y="464" class="sub">to save Custom Map Pin</text>
  <path d="M1340 505 H1540 V569 H1340 Z" fill="#f5f5f5" stroke="#666666"/><text x="1355" y="529" class="note">Custom Map Pins are lightweight personal places:</text><text x="1355" y="549" class="note">no price, availability, or supplier link.</text>
  <text x="580" y="637" class="lane">C · Manage saved items</text><rect x="580" y="660" width="185" height="72" class="node info"/><text x="673" y="691" class="main">Open saved pin details</text><text x="673" y="714" class="main">or categorized list</text><rect x="820" y="660" width="260" height="72" class="node traveler"/><text x="950" y="691" class="main">Request removal, or edit</text><text x="950" y="714" class="sub">Custom Map Pin category/location</text><rect x="1135" y="660" width="200" height="72" class="node control"/><text x="1235" y="691" class="main">Explicit confirmation</text><text x="1235" y="714" class="sub">of exact saved-plan change</text><rect x="1390" y="660" width="150" height="72" class="node plan"/><text x="1465" y="691" class="main">Update Plan</text><text x="1465" y="714" class="main">and Canvas</text>
  <path d="M260 429 H300" class="edge"/><text x="280" y="417" class="label">open</text><path d="M520 429 H550 V191 H580" class="edge"/><text x="550" y="181" class="label">search option</text><path d="M520 429 H550 V446 H580" class="edge"/><text x="550" y="436" class="label">search map</text><path d="M520 429 H550 V696 H580" class="edge"/><text x="550" y="686" class="label">view saved</text>
  <path d="M765 191 H820" class="edge"/><path d="M1030 191 H1085" class="edge"/><text x="1058" y="181" class="label">add</text><path d="M1285 191 H1340" class="edge"/><text x="1312" y="181" class="label">confirmed</text><path d="M765 446 H820" class="edge"/><path d="M1030 446 H1085" class="edge"/><text x="1058" y="436" class="label">save</text><path d="M1285 446 H1340" class="edge"/><path d="M765 696 H820" class="edge"/><path d="M1080 696 H1135" class="edge"/><path d="M1335 696 H1390" class="edge"/><text x="1362" y="686" class="label">confirmed</text>
  <rect x="60" y="830" width="1480" height="54" fill="#f5f5f5" stroke="#666666" rx="7"/><text x="80" y="853" class="legend" font-weight="700">Legend</text><text x="80" y="874" class="legend">Blue: traveler action · Green: provider result · Purple: Canvas · Yellow: explicit confirmation · Red: saved Plan change · Grey: information or temporary state</text>
</svg>
